<style>
  :root{
    --maroon:#7a1414; --maroon-dark:#4a0c0c; --ember:#c9651a; --gold:#ffd34d;
    --cream:#fff8ea; --ink:#2a1408; --ink-soft:#6b4a2e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; width:100%; height:100%;
    font-family:'Segoe UI', Roboto, 'Noto Sans Tamil', Arial, sans-serif;}
  body{
    background:linear-gradient(160deg, #4a0c0c 0%, #7a1414 45%, #a8581a 100%);
    color:#fff8e6; display:flex; align-items:center; justify-content:center;
    min-height:100vh; min-height:100dvh; padding:24px;
  }
  .card{
    background:rgba(0,0,0,0.18); border:1.5px solid var(--gold); border-radius:20px;
    padding:36px 26px 30px; width:100%; max-width:400px; text-align:center;
    box-shadow:0 12px 34px rgba(0,0,0,0.35);
  }
  .logo{
    width:64px; height:64px; border-radius:50%; background:var(--gold); color:var(--maroon-dark);
    display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:800;
    margin:0 auto 14px;
  }
  .shop-ta{font-size:26px; font-weight:800; color:#fff8e6; line-height:1.3; text-shadow:0 1px 3px rgba(0,0,0,0.3);}
  .shop-en{font-size:12px; font-weight:700; letter-spacing:2.5px; color:var(--gold); margin-top:6px;}
  .tagline{font-size:12px; color:#ffe1a8; margin-top:14px; line-height:1.6;}
  .open-btn{
    display:block; width:100%; margin-top:26px; padding:15px; border-radius:12px; border:none;
    background:var(--gold); color:var(--maroon-dark); font-weight:800; font-size:15.5px;
    text-decoration:none; letter-spacing:0.2px;
  }
  .open-btn:active{opacity:0.85;}
  .footnote{font-size:10.5px; color:#ffe1a8; opacity:0.75; margin-top:20px; line-height:1.6;}
</style>

  <div class="card">
    <div class="logo">A</div>
    <div class="shop-ta">A.R.S பட்டாசுக் கடை</div>
